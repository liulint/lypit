name: macOS and Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./...
        working-directory: server
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
        working-directory: server
      - if: runner.os == 'macOS'
        run: go test -race ./...
        working-directory: server
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:Path = $env:Path + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          (Split-Path (Get-Command ffmpeg).Source) | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: go test -run TestMockFilmIntegration -v -timeout 6m
        working-directory: server
        env:
          CGO_ENABLED: '0'
          LYPIT_INTEGRATION: '1'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/start.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
